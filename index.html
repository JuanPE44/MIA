<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <title>MIA — Tu copiloto de estudio</title>
    <meta name="description" content="MIA convierte tus apuntes, PDF y enlaces en un cuaderno de estudio: chatea con citas de tus fuentes, genera resúmenes y tarjetas, y estudia con recuerdo activo y modo blindado." />
    <meta name="application-name" content="MIA" />
    <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="MIA" />
    <meta property="og:title" content="MIA — Tu copiloto de estudio" />
    <meta property="og:description" content="Organiza tus fuentes, chatea con citas y estudia con recuerdo activo. Todo en un cuaderno." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MIA — Tu copiloto de estudio" />
    <meta name="twitter:description" content="Organiza tus fuentes, chatea con citas y estudia con recuerdo activo." />
    <script>
      // Apply the persisted theme before first paint (mirrors ThemeProvider).
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('mia_theme_mode') || 'system'; } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) root.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
